plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'jacoco'

    id "io.spring.dependency-management" version "1.1.0"
}

dependencyManagement {
    imports {
        mavenBom("com.azure.spring:spring-cloud-azure-dependencies:7.0.0-beta.1")
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

group = 'com.trecapps'
version = '1.0-SNAPSHOT'

targetCompatibility = 21
sourceCompatibility = 21

repositories {
    mavenCentral()
    maven {
        url azureRepoUrl
        name 'tcMavenRepo'
        credentials {
            username azureRepoUsername
            password azureRepoPassword
        }
    }
}

jar{
    //archiveClassifier=''
    enabled = false
}

dependencies {

    implementation 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    //Enable Trec-Auth
    implementation 'com.trecapps.auth:TrecAuth:1.0.0-M2'

    implementation "com.microsoft.azure:applicationinsights-runtime-attach:3.7.6"

    // Spring Boot features
    //implementation("org.springframework.boot:spring-boot-starter-web")
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-quartz"
    implementation 'com.zaxxer:HikariCP:6.2.1' // Used to resolve java.lang.AbstractMethodError: Receiver class
    // com.zaxxer.hikari.metrics.micrometer.MicrometerMetricsTrackerFactory

    // Security Dependencies
    implementation "org.springframework.boot:spring-boot-starter-security"
    //implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
    implementation 'com.stripe:stripe-java:24.22.0'

    // Azure Resources
    implementation 'com.azure:azure-messaging-servicebus'
    implementation 'com.azure:azure-identity'
    implementation "com.azure.spring:spring-cloud-azure-starter-keyvault"
    implementation 'dev.samstevens.totp:totp:1.7.1'  // MFA Support

    // DB Support
    implementation 'org.hibernate:hibernate-core:6.1.6.Final'
    implementation 'org.hibernate:hibernate-entitymanager:5.6.14.Final'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'jakarta.persistence:jakarta.persistence-api:+'

    //implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    // Use JWT for token generation and verification
    implementation 'com.auth0:java-jwt:+'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:+'

    implementation "org.springframework.boot:spring-boot-starter-data-mongodb-reactive"   // Profiles and posts
    implementation "org.springframework.boot:spring-boot-starter-data-cassandra-reactive" // Connections and Reactions
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0' // Used for Time based UUIDs




    implementation 'com.mysql:mysql-connector-j:9.4.0' // mySQL
    implementation 'com.azure:azure-storage-blob'


    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Vuln mitigation
    implementation 'com.beust:jcommander:1.75'
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
}

test {
    useJUnitPlatform()
}